# Ruff config for CI lint of services/agents-py and tools/.
# Run from the repo root: ruff check --config tools/ruff.toml services/agents-py tools
target-version = "py312"
extend-exclude = [".venv", "**/.venv"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Baseline: findings that predate the lint gate. Remove an entry once the
# file is cleaned up; new files get no exemptions.
"**/agents_py/main.py" = ["F841"]  # unused `response` in the LLM parse stub
