# Core packages held to the coverage gate (tools/coverage_gate.py).
#
# Only the packages listed here are gated. To gate a new package (ledger,
# safety, pricing, ...), add its directory below. A listed Python package
# that does not exist yet is reported as "pending" instead of failing, so it
# can be added here before its code lands. An entry (Go or Python) may also
# be a single file.

threshold: 96.0

go:
  # Go coverprofile written by:
  #   go test -race -covermode=atomic -coverpkg=./internal/... -coverprofile=coverage.out ./...
  # -coverpkg counts statements exercised from any package's tests.
  profile: services/dispatch-go/coverage.out
  module: github.com/hexago/hexago/services/dispatch-go
  packages:
    - internal/geo
    - internal/fleet
    - internal/matching
    - internal/ledger
    - internal/safety
    # - internal/pricing
    - internal/scheduler
    # Public API platform: API keys, scopes, rate limits, webhooks; OpenAPI document.
    - internal/developer
    - internal/apidocs
    # Take-over mode: the human-driver state machine (offer / accept / decline / timeout / TTL) and its dispatch hooks.
    - internal/sim/takeover.go
    - internal/dispatch/takeover.go

python:
  # Cobertura XML written by: pytest --cov=src --cov-report=xml:coverage.xml
  report: services/agents-py/coverage.xml
  root: services/agents-py
  packages:
    - src/agents_py/core
    - src/agents_py/agents/safety
    - src/agents_py/agents/settlement
    # Booking Intent: rule-based fallback parser and itinerary timing; pricing quote function.
    - src/agents_py/agents/booking/fallback_parser.py
    - src/agents_py/agents/booking/itinerary.py
    - src/agents_py/agents/pricing/quote.py
    # Surge Equilibrium surge map.
    - src/agents_py/agents/pricing/surge_map.py
    # Demand Forecast: pure model, data source, agent loop and endpoint.
    - src/agents_py/agents/forecast
    # Legal & Jurisdiction: rule extractor + diff (legal_rules.py), store, agent, API.
    - src/agents_py/agents/legal
    # Ops Supervisor Autonomous Ops Report: report builder (report.py), runner, API.
    - src/agents_py/agents/supervisor
