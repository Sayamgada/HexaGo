name: Self-heal

# When CI fails on main or a pull request, tools/self_heal.py asks the LLM for
# a minimal patch, verifies it by rerunning only the failing suites (up to 3
# attempts), and opens an autofix/<run-id> PR. See docs/AUTOCODING.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# One healing run per failing CI run, ever.
concurrency:
  group: self-heal-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write   # read job logs, dispatch CI on the autofix branch
  issues: write    # labels

jobs:
  heal:
    # Cheap pre-filters; tools/self_heal.py re-checks every guardrail.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'autofix/') &&
      !contains(github.event.workflow_run.head_commit.message, '[ai-autofix')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      # Event fields go through env, never inline in shell (they are user-controlled).
      GITHUB_REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
      HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
      PR_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
      # Optional PAT/App token: lets autofix pushes trigger CI and deploys directly.
      GH_TOKEN: ${{ secrets.AUTOFIX_TOKEN || github.token }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini/gemini-3.8-flash' }}
      # Tried in order when LLM_MODEL fails (e.g. a retired model returns 404).
      LLM_FALLBACK_MODELS: ${{ vars.LLM_FALLBACK_MODELS || 'gemini/gemini-3.8-flash' }}
      # The healer is trusted code from the default branch; it operates on the
      # failing commit checked out at the workspace root.
      HEXAGO_REPO_ROOT: ${{ github.workspace }}
      HEAL: .selfheal/trusted/tools
      CGO_ENABLED: "1"
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.AUTOFIX_TOKEN || github.token }}

      # Run the healer from the default branch, never from the (possibly stale
      # or untrusted) failing commit. .selfheal/ is ignored by the healer's git ops.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .selfheal/trusted
          sparse-checkout: tools
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .selfheal/trusted/tools/requirements*.txt

      - name: Plan (guardrails + failing suites)
        id: plan
        run: |
          pip install -q -r "$HEAL/requirements-dev.txt"
          python "$HEAL/self_heal.py" plan

      - name: Install self-heal runtime (LiteLLM)
        if: steps.plan.outputs.skip == 'false'
        run: pip install -q -r "$HEAL/requirements.txt"

      - uses: actions/setup-go@v5
        if: steps.plan.outputs.skip == 'false' && steps.plan.outputs.need_go == 'true'
        with:
          go-version-file: services/dispatch-go/go.mod
          cache-dependency-path: services/dispatch-go/go.sum

      - name: Install agents-py dependencies
        if: steps.plan.outputs.skip == 'false' && steps.plan.outputs.need_python == 'true'
        run: pip install -q -r services/agents-py/requirements.txt -r services/agents-py/requirements-dev.txt

      - uses: subosito/flutter-action@v2
        if: steps.plan.outputs.skip == 'false' && steps.plan.outputs.need_flutter == 'true'
        with:
          channel: stable
          cache: true

      - name: Heal (LLM patch -> rerun failing suites, up to 3 attempts -> PR)
        if: steps.plan.outputs.skip == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUITES: ${{ steps.plan.outputs.suites }}
        run: python "$HEAL/self_heal.py" fix --suites "$SUITES"
