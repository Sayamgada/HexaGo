name: CI

# Job names are read by tools/self_heal.py to decide which suite to repair
# and rerun: keep them as go / python / flutter / tools / coverage-gate /
# test-first.

on:
  push:
    branches: [main]
  pull_request:
  # self-heal.yml dispatches CI on autofix/* branches (events made with
  # GITHUB_TOKEN don't trigger push/pull_request runs; dispatch does).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PY_VERSION: "3.12"

jobs:
  test-first:
    name: test-first
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: New source files in services/ must ship with a test
        run: python tools/test_first_check.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"

  tools:
    name: tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - run: pip install -r tools/requirements-dev.txt
      - name: Lint tools
        run: ruff check --config tools/ruff.toml tools
      - name: Unit-test the assembly-line tools
        run: python -m pytest tools/tests -q --cov=tools --cov-report=term-missing

  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      # Postgres for the ledger and store integration tests (throwaway schemas per test).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/dispatch-go
    env:
      CGO_ENABLED: "1"
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/dispatch-go/go.mod
          cache-dependency-path: services/dispatch-go/go.sum
      - run: go mod download
      - run: go vet ./...
      - name: go test -race (coverage across packages)
        run: go test -race -covermode=atomic -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: services/dispatch-go/coverage.out
          retention-days: 7

  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/agents-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: pip
          cache-dependency-path: |
            services/agents-py/requirements.txt
            services/agents-py/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff
        run: ruff check --config ../../tools/ruff.toml .
      - name: pytest --cov
        run: pytest -q --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Python SDK (lint + unit tests)
        run: |
          ruff check --config ../../tools/ruff.toml ../../sdk/python
          python -m pytest -q -p no:cacheprovider ../../sdk/python
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: services/agents-py/coverage.xml
          retention-days: 7

  flutter:
    name: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/hexago_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  coverage-gate:
    name: coverage-gate
    needs: [go, python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
      - run: pip install pyyaml==6.0.3
      - uses: actions/download-artifact@v4
        with:
          name: go-coverage
          path: services/dispatch-go
      - uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: services/agents-py
      - name: Core coverage >= threshold (tools/coverage_targets.yml)
        run: python tools/coverage_gate.py --json coverage-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-summary
          path: coverage-summary.json
          retention-days: 30

  autocoding-stats:
    name: autocoding-stats
    needs: [coverage-gate, tools, flutter]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: coverage-summary
      - name: Compute docs/AUTOCODING_STATS.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/autocoding_stats.py --coverage-json coverage-summary.json
      - name: Commit stats [skip ci]
        run: |
          if [ -z "$(git status --porcelain -- docs/AUTOCODING_STATS.md)" ]; then
            echo "Stats unchanged."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AUTOCODING_STATS.md
          git commit -m "chore(stats): update AUTOCODING_STATS.md [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::warning::Could not push stats (main moved or is protected)."
