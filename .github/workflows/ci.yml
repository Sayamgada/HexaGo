name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-go:
    name: Go Tests (dispatch-go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dispatch-go
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/dispatch-go/go.sum

      - name: Install C build dependencies (for h3-go CGO)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Verify Go dependencies
        run: go mod download

      - name: Run Go tests with coverage
        run: CGO_ENABLED=1 go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

  test-python:
    name: Python Tests (agents-py)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agents-py
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            services/agents-py/requirements.txt
            services/agents-py/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest with coverage
        run: pytest -v --cov=. --cov-report=term-missing --cov-report=xml

  test-flutter:
    name: Flutter Analyze & Test (hexago_app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hexago_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze

      - name: Run Flutter tests with coverage
        run: flutter test --coverage
